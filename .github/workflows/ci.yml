name: ci

on:
  push:
    branches: [main, 'orch/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 (lightweight tag, resolves directly to the commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml pins 1.99.1)
        run: |
          cargo --version
          rustc --version | grep -F '1.99.1'
      - name: Install gitleaks 8.30.1 (sha256 pinned)
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          gitleaks version
          shellcheck --version
      - name: Gate
        env:
          LUNEPACK_REQUIRE_GITLEAKS: '1'
          LUNEPACK_REQUIRE_SHELLCHECK: '1'
        run: ./scripts/gate.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.90.0 (minimal)
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check at the MSRV
        run: cargo +1.90.0 check --workspace --all-targets --locked

  os-trust:
    # the production transport honours the OS trust store and the system proxy (a regression check,
    # not an experiment: scripts/ci/os-trust.sh and .ps1, ported from probe P-N1). The scripts
    # change the hosted runner's trust store and proxy settings and undo them on every exit path.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash }
          - { os: macos-latest, shell: bash }
          - { os: windows-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: OS trust and system proxy (bash)
        if: matrix.shell == 'bash'
        timeout-minutes: 20
        shell: bash
        run: ./scripts/ci/os-trust.sh
      - name: OS trust and system proxy (pwsh)
        if: matrix.shell == 'pwsh'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/ci/os-trust.ps1

  runtime-musl:
    # the static musl runtime (M5-D7), built by scripts/build-runtime.sh, which also checks that it
    # is static and prints its size. The binary is an artifact for the E2E job. The job uses no credentials.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, triple: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: linux-aarch64, triple: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install musl-tools (the C compiler for the musl target) and the Rust target
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "${{ matrix.triple }}"
      - name: Build the runtime and check that it is static
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          ./scripts/build-runtime.sh "${{ matrix.target }}" --out "$RUNNER_TEMP/runtime/lunepack-runtime"
      # actions/upload-artifact v7.0.2 (lightweight tag, resolves directly to the commit)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lunepack-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/runtime/lunepack-runtime
          if-no-files-found: error
          retention-days: 7

  e2e-linux:
    # the end-to-end suite of the Linux runtime (M5-D13) on the hosted x86_64 runner: install,
    # updates, rollbacks and uninstall through the static runtime built by `runtime-musl`, and
    # (M6 step 11) setup files and a UI that is absent, killed or cannot start. The script builds
    # the stand-in UI and the real `lunepack-ui` itself; nothing needs a GPU or a display (the real
    # UI is started once with a DISPLAY that no server answers, to see it exit with its typed
    # code). It is not part of the gate; a skip here is a failure (LUNEPACK_E2E_REQUIRE).
    needs: runtime-musl
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2 (lightweight tag, resolves directly to the commit)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: lunepack-runtime-linux-x86_64
          path: ${{ runner.temp }}/runtime
      - name: Install desktop-file-utils (the suite validates the desktop entries it writes)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
      - name: End-to-end suite
        env:
          LUNEPACK_E2E_REQUIRE: '1'
        run: ./scripts/e2e.sh --inside --runtime "$RUNNER_TEMP/runtime/lunepack-runtime"

  e2e-windows:
    # the end-to-end suite of the Windows runtime (M7 step 13, scripts/e2e-windows.ps1): per-user
    # install from a `Setup.exe`, the stub launcher, updates, rollbacks, uninstall, a planted-DLL
    # check of every shipped binary, and (CI only) the signed `Setup.exe` test, which trusts a
    # throwaway certificate on this disposable runner. It installs for real under the runner's
    # profile. Defender is as the runner image has it; `e2e-windows-defender` is the same with
    # Defender on. A skip is not a pass: the script exits non-zero on a failed row.
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Windows end-to-end suite
        shell: pwsh
        run: ./scripts/e2e-windows.ps1

  e2e-windows-defender:
    # the same suite with Windows Defender on (M7 step 14; probe P-W4 showed the runner can run
    # it). The first step turns Defender on and proves it with a control (a test string that must
    # be detected, else the job is INVALID). A detection during the suite fails the job and its
    # threat name is in the artifact: the answer to a flagged lunepack binary is code signing
    # (M9), not an exclusion.
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Defender on, with the detection control
        shell: pwsh
        run: ./scripts/ci/defender-on.ps1
      - name: Windows end-to-end suite
        shell: pwsh
        run: ./scripts/e2e-windows.ps1
      - name: Detections during the suite (names only)
        if: always()
        shell: pwsh
        run: ./scripts/ci/defender-on.ps1 -Report "$env:RUNNER_TEMP/defender-detections.txt"
      # actions/upload-artifact v7.0.2, as in runtime-musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: defender-detections
          path: ${{ runner.temp }}/defender-detections.txt
          if-no-files-found: ignore
          retention-days: 7
