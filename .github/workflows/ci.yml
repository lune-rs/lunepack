name: ci

on:
  push:
    branches: [main, 'orch/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1 (lightweight tag, resolves directly to the commit)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Toolchain (rust-toolchain.toml pins 1.99.1)
        run: |
          cargo --version
          rustc --version | grep -F '1.99.1'
      - name: Install gitleaks 8.30.1 (sha256 pinned)
        run: |
          set -euo pipefail
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Tool versions
        run: |
          gitleaks version
          shellcheck --version
      - name: Gate
        env:
          LUNEPACK_REQUIRE_GITLEAKS: '1'
          LUNEPACK_REQUIRE_SHELLCHECK: '1'
        run: ./scripts/gate.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.90.0 (minimal)
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Check at the MSRV
        run: cargo +1.90.0 check --workspace --all-targets --locked

  os-trust:
    # the production transport honours the OS trust store and the system proxy (a regression check,
    # not an experiment: scripts/ci/os-trust.sh and .ps1, ported from probe P-N1). The scripts
    # change the hosted runner's trust store and proxy settings and undo them on every exit path.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash }
          - { os: macos-latest, shell: bash }
          - { os: windows-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: OS trust and system proxy (bash)
        if: matrix.shell == 'bash'
        timeout-minutes: 20
        shell: bash
        run: ./scripts/ci/os-trust.sh
      - name: OS trust and system proxy (pwsh)
        if: matrix.shell == 'pwsh'
        timeout-minutes: 20
        shell: pwsh
        run: ./scripts/ci/os-trust.ps1

  runtime-musl:
    # the static musl runtime (M5-D7), built by scripts/build-runtime.sh, which also checks that it
    # is static and prints its size. The binary is an artifact for the E2E job. The job uses no credentials.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, triple: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: linux-aarch64, triple: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install musl-tools (the C compiler for the musl target) and the Rust target
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add "${{ matrix.triple }}"
      - name: Build the runtime and check that it is static
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime"
          ./scripts/build-runtime.sh "${{ matrix.target }}" --out "$RUNNER_TEMP/runtime/lunepack-runtime"
      # actions/upload-artifact v7.0.2 (lightweight tag, resolves directly to the commit)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lunepack-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/runtime/lunepack-runtime
          if-no-files-found: error
          retention-days: 7

  e2e-linux:
    # the end-to-end suite of the Linux runtime (M5-D13) on the hosted x86_64 runner: install,
    # updates, rollbacks and uninstall through the static runtime built by `runtime-musl`. It is
    # not part of the gate; a skip here is a failure (LUNEPACK_E2E_REQUIRE).
    needs: runtime-musl
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/download-artifact v8.0.2 (lightweight tag, resolves directly to the commit)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: lunepack-runtime-linux-x86_64
          path: ${{ runner.temp }}/runtime
      - name: Install desktop-file-utils (the suite validates the desktop entries it writes)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
      - name: End-to-end suite
        env:
          LUNEPACK_E2E_REQUIRE: '1'
        run: ./scripts/e2e.sh --inside --runtime "$RUNNER_TEMP/runtime/lunepack-runtime"

  ui:
    # the UI (M6): the golden frames of every screen and transition, the accessibility tree, the
    # smoke test of the real `lunepack-ui` binary against a scripted engine, and the size report.
    # linux-golden compares in the reference image (scripts/ui-golden.Dockerfile: the same Mesa as a
    # local run, so the tolerance is exact); macos and windows render natively and compare with the
    # cross-adapter tolerance; linux-baseline (the oldest runner) builds the release binary, records
    # the glibc it needs and runs the smoke test under Xvfb with the distribution's Mesa, comparing no
    # pixels. Every leg uploads what it rendered and reports the binary's size (D37 (b): reported,
    # never a failure). The signing keys of the size report are made in the job and never leave it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-golden, os: ubuntu-latest }
          - { name: linux-baseline, os: ubuntu-22.04 }
          - { name: macos, os: macos-latest }
          - { name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LUNEPACK_GOLDEN_OUT: ${{ github.workspace }}/target/ui-golden-out
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Xvfb and Mesa (the distribution's software Vulkan driver) for the smoke test
        if: matrix.name == 'linux-baseline'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 libxkbcommon-x11-0 libx11-xcb1 binutils
      - name: Golden frames in the reference image
        if: matrix.name == 'linux-golden'
        run: ./scripts/ui-golden.sh --docker
      - name: Golden frames, natively (cross-adapter tolerance)
        if: matrix.name == 'macos' || matrix.name == 'windows'
        shell: bash
        env:
          LUNEPACK_GOLDEN_CLASS: cross
        run: cargo test -p lunepack-ui-luneui --locked --test golden -- --ignored
      - name: Accessibility tree, keyboard and the checks that need no GPU
        run: cargo test -p lunepack-ui-luneui --locked --test access --test golden
      - name: Smoke test of the binary (natively)
        if: matrix.name == 'macos' || matrix.name == 'windows'
        shell: bash
        run: cargo test -p lunepack-ui --locked --test smoke -- --ignored
      - name: Smoke test of the binary under Xvfb
        if: matrix.name == 'linux-baseline'
        run: xvfb-run -a cargo test -p lunepack-ui --locked --test smoke -- --ignored
      - name: Build the release binary and the packager
        shell: bash
        run: cargo build --release --locked -p lunepack-ui -p lunepack-cli
      - name: Size report (raw size and the frame length lunepack pack chooses)
        shell: bash
        run: |
          set -euo pipefail
          ext=
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          ./scripts/ci/ui-size.sh "target/release/lunepack-ui$ext" "target/release/lunepack$ext"
      - name: The glibc the binary needs (derived from the binary)
        if: matrix.name == 'linux-baseline'
        run: |
          set -euo pipefail
          highest=$(objdump -T target/release/lunepack-ui | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -n 1)
          [ -n "$highest" ] || { echo "no GLIBC_ symbol version found in the binary" >&2; exit 1; }
          echo "highest glibc symbol version: $highest"
          {
            echo "### lunepack-ui glibc baseline (ubuntu-22.04)"
            echo
            echo "Highest GLIBC_ version in the dynamic symbols (objdump -T): \`$highest\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v7.0.2 (lightweight tag, resolves directly to the commit)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && matrix.name != 'linux-baseline'
        with:
          name: ui-golden-renders-${{ matrix.name }}
          path: target/ui-golden-out
          if-no-files-found: error
          retention-days: 7
