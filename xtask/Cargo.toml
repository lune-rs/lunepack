[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = "1"
cargo_metadata = "0.23.1"
toml = "1.2"
# The C header of `lunepack-ffi` (M14-D8): as a library, no default features (no clap, no logger
# binary). MPL-2.0 (an allowed licence); xtask is never shipped.
cbindgen = { version = "=0.29.4", default-features = false }
# The C compiler of `build-example-c`: the toolchain finder the HTTP stack's build scripts already use
# (the version in the lock); no code of it runs in a release.
cc = "1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
