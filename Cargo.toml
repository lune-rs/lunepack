[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["probes", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lune-rs/lunepack"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
lunepack-core = { path = "crates/lunepack-core", version = "=0.1.0" }
lunepack-testkit = { path = "crates/lunepack-testkit" }
lunepack-crypto = { path = "crates/lunepack-crypto", version = "=0.1.0" }
lunepack-codec-lzma = { path = "crates/lunepack-codec-lzma", version = "=0.1.0" }
lunepack-fs = { path = "crates/lunepack-fs", version = "=0.1.0" }
lunepack-http = { path = "crates/lunepack-http", version = "=0.1.0" }
lunepack-os-windows = { path = "crates/lunepack-os-windows", version = "=0.1.0" }
lunepack-os-macos = { path = "crates/lunepack-os-macos", version = "=0.1.0" }
lunepack-os-linux = { path = "crates/lunepack-os-linux", version = "=0.1.0" }
lunepack = { path = "crates/lunepack", version = "=0.1.0" }
lunepack-runtime = { path = "crates/lunepack-runtime" }
lunepack-cli = { path = "crates/lunepack-cli", version = "=0.1.0" }
lunepack-ui-luneui = { path = "crates/lunepack-ui-luneui" }
# The C binding (M14): publish = false, no version pin; only the runtime's drift test links it.
lunepack-ffi = { path = "crates/lunepack-ffi" }

# Core's pure external crates (M2-D1); the boundary check allowlists exactly these for lunepack-core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
semver = "1"
unicode-normalization = "0.1"
thiserror = "2"
# Library logging (hard rule 4): libraries emit events and never install a subscriber. The version
# already in the lock (through the HTTP stack); no default features, so no proc-macro crate.
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Crypto adapter (M2 step 7): pure Rust, no C. rand_core/getrandom are for tests only (crate dev-dependencies).
sha2 = { version = "0.11", default-features = false }
ed25519-dalek = { version = "3", default-features = false }
# Signers (M3 step 6): key generation, key buffers that wipe themselves, and test directories.
getrandom = "0.4"
zeroize = { version = "1", default-features = false, features = ["alloc"] }
tempfile = "3"

# Filesystem adapter (M4 step 4): the OS file lock (D15; pure Rust, rustix on Unix, windows-sys on
# Windows) and the open(2) flag constants.
fs4 = "1.1"
libc = "0.2"
# macOS publisher check (M9-D10): exact pins of the versions already in the lock.
security-framework = "=3.7.0"
core-foundation = "=0.10.1"

# Command-line packager (M3 step 7).
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "1.2"
# The `.zip` writer of `lunepack setup --zip` (M8-D9): deflate only, the pure-Rust backend (no C, no
# zlib), used by lunepack-cli alone.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# HTTP adapter (M4 step 8): ureq with rustls (ring) and the platform verifier, no content decoding
# (D23, M4-D14). ring stays confined to lunepack-http (M4-D16).
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "win-system-proxy"] }
url = "2"

# UI adapter (M6 step 1, D39 (b)): LuneUI as a git dependency pinned to a commit (the v0.7.0 tag).
# The boundary check allows exactly this source and confines it to lunepack-ui-luneui.
lune-ui = { git = "https://github.com/lune-rs/luneui-rs", rev = "cbeae0109f970eaede7f1826414f139bb8eace65", features = ["accesskit"] }
# The same crates LuneUI itself uses, for the UI adapter's headless render (wgpu's texture format) and
# its icon decoder (png); both are already in LuneUI's graph, so the lock gains no package.
wgpu = "30"
png = "0.18"

# OS adapters (M6 step 9, M6-D8; M7 step 5): the Windows reduce-motion reader calls user32 through
# windows-sys, already in the lock for other crates; no window stack. The process adapter adds the
# process snapshot and process-handle APIs (kernel32). The integration (M7 step 6) adds the
# registry (advapi32; `RegCreateKeyExW` is behind `Win32_Security`) and file attributes. The launcher
# stub (M7 step 8) adds the raw command line and the console control handler.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # Security descriptors by SDDL and by handle (`GetSecurityInfo`, `ConvertSidToStringSidW`) for
    # the protected directories (M10 step 7).
    "Win32_Security_Authorization",
    # WinVerifyTrust for the publisher check (M9-D8); the provider-data types it hands back sit
    # behind the cryptography features.
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    # Overlapped I/O (the named pipe, M10 step 8).
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    # Named pipes (M10 step 8).
    "Win32_System_Pipes",
    "Win32_System_Registry",
    # The Service Control Manager (M10 step 9).
    "Win32_System_Services",
    # The Windows directory, asked of the system for the service self-test's environment (M10 step 9).
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# COM for the Windows Start-menu shortcut (M7-D4): IShellLinkW, IPersistFile and IPropertyStore,
# used only by lunepack-os-windows. The version is the one the UI stack already pulls in, so the
# lock gains no package. `REACH_ONLY_THROUGH` in the boundary check holds it to that crate and to
# the UI adapter (D17).
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

# The window stack the UI binary needs, named through lunepack-ui-luneui's re-exports so the
# boundary check still sees it reachable only through that crate (the version LuneUI uses).
winit = "0.30"

# Tests only (lunepack-ui-luneui): AccessKit's own consumer, the tree the OS adapters run, already in
# the lock through the platform adapters, replays the screens' accessibility tree.
accesskit_consumer = "0.39"
