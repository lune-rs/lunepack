[package]
name = "lunepack-fs"
description = "Filesystem adapter for lunepack: file operations over std, the OS advisory lock, and the place and exchange primitives the updater needs."
readme = "README.md"
# The tests (their fixtures, goldens and the fuzz replay) are a checkout's, not a package's.
exclude = ["/tests"]
keywords = ["filesystem", "lock", "atomic", "updater", "installer"]
categories = ["filesystem"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# An allowlisted crate (hard rule 2): a full copy of the workspace lints in which `unsafe_code` is
# `deny` instead of `forbid`, so the few modules that need it opt in with `#![allow(unsafe_code)]`,
# and every unsafe block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
lunepack-core.workspace = true
fs4 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW and O_CLOEXEC for `create_new`; `renamex_np`, `statfs`, `statvfs`, `faccessat` and
# `geteuid` for `exchange` and `place` (the only unsafe code, in `unix_sys.rs` and `macos.rs`).
libc = { workspace = true }

[dev-dependencies]
lunepack-testkit.workspace = true
tempfile = "3"

# Own main: the lock test re-runs this binary as a child process that holds the lock and is then
# killed (the lock must be released when its holder dies).
[[test]]
name = "lock"
harness = false
