[package]
name = "lunepack-os-linux"
description = "Linux adapter for lunepack: XDG desktop entries, process restart, and the per-machine pieces (systemd socket service, polkit hand-off, policy file)."
readme = "README.md"
# The tests (their fixtures, goldens and the fuzz replay) are a checkout's, not a package's.
exclude = ["/tests"]
keywords = ["linux", "xdg", "systemd", "installer", "updater"]
categories = ["os::linux-apis"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# An allowlisted crate (hard rule 2): a full copy of the workspace lints in which `unsafe_code` is
# `deny` instead of `forbid`, so the few functions that need it opt in with `#[allow(unsafe_code)]`,
# and every unsafe block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
lunepack-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# setsid(2) for a detached spawn and kill(2) for SIGTERM to an own child; nothing else.
libc = { workspace = true }

[dev-dependencies]
lunepack-testkit.workspace = true

# Own main: the test binary is also the helper program the process suite and the tests start
# (its first argument names the helper mode), and the cases run one after another.
[[test]]
name = "process"
harness = false

# Own main: the test binary is also the child that takes descriptor 3 (`--child`), so no other
# test's descriptors meet it.
[[test]]
name = "activation"
harness = false
