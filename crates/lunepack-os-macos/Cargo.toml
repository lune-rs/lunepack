[package]
name = "lunepack-os-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# An allowlisted crate (hard rule 2): a full copy of the workspace lints in which `unsafe_code` is
# `deny` instead of `forbid`, so the few modules that need it opt in with `#![allow(unsafe_code)]`,
# and every unsafe block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
lunepack-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# libproc (process identity, the in-use scan), kqueue (waiting for a non-child), setsid(2) for a
# detached spawn and kill(2) for SIGTERM to an own child; nothing else.
libc = { workspace = true }
# The publisher check (M9-D7, M9-D10): `SecStaticCode`, `SecRequirement` and `Flags` of
# Security.framework, over CoreFoundation's wrappers. Both are exact pins of what the lock already
# holds for the HTTP stack; `REACH_ONLY_THROUGH` confines `security-framework` to this crate and to
# `lunepack-http`.
security-framework = { workspace = true }
core-foundation = { workspace = true }

[dev-dependencies]
lunepack-testkit.workspace = true

# Own main: the test binary is also the helper program the process suite and the tests start
# (its first argument names the helper mode), and the cases run one after another.
[[test]]
name = "process"
harness = false
