# The generator's settings for `include/lunepack.h` (M14-D8): `cargo run -p xtask -- ffi-header`.
# The output must be the same bytes on every machine: LF line ends, and no path, date or host.

language = "C"
header = "/* SPDX-License-Identifier: MIT OR Apache-2.0 */"
autogen_warning = "/* Generated by `cargo run -p xtask -- ffi-header` from crates/lunepack-ffi; do not edit. */"
include_guard = "LUNEPACK_H"
cpp_compat = true
line_endings = "LF"
usize_is_size_t = true
documentation = true
documentation_style = "c99"
style = "type"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
braces = "SameLine"
tab_width = 2

[parse]
parse_deps = false
