[package]
name = "lunepack-cli"
description = "The lunepack command: package releases, build installers and signed feeds, and manage signing keys for lunepack-updated applications."
readme = "README.md"
# The tests (their fixtures, goldens and the fuzz replay) are a checkout's, not a package's.
exclude = ["/tests"]
keywords = ["packager", "installer", "updater", "release", "signing"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "lunepack"
path = "src/main.rs"
doc = false

[dependencies]
lunepack-core.workspace = true
lunepack-crypto.workspace = true
lunepack-codec-lzma.workspace = true
lunepack.workspace = true
clap = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
# The publisher state file (M3-R2-D1).
serde_json = { workspace = true }
tempfile = { workspace = true }
# The `.zip` writer's deflate and CRC-32 (M8-D9); pure-Rust backend only.
flate2 = { workspace = true }
# Stamps the Windows stub and setup runtime's icon and version info (M7-D14); pure Rust, used only
# here (boundary check CONFINED) and pinned exactly (M7-D22, D17).
editpe = { version = "=0.2.4", default-features = false, features = ["std"] }

[dev-dependencies]
lunepack-testkit.workspace = true
base64 = { workspace = true }
tempfile = { workspace = true }
# Tests read the documents the binary wrote back through the real verifiers.
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem"] }

# Own main: the test binary is also the helper program the runner tests start (`--helper <mode>`),
# and the cases run one after another. It compiles `src/tool.rs` itself (a bin crate has no lib).
[[test]]
name = "tool"
harness = false
