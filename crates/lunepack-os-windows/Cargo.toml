[package]
name = "lunepack-os-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# An allowlisted crate (hard rule 2): a full copy of the workspace lints in which `unsafe_code` is
# `deny` instead of `forbid`, so the one function that needs it opts in with `#[allow(unsafe_code)]`,
# and every unsafe block carries a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
lunepack-core.workspace = true

[target.'cfg(windows)'.dependencies]
# SystemParametersInfoW for the client-area animation setting (M6-D8); the DLL search hardening, the
# known folders, the message box and the app user model id (M7).
windows-sys = { workspace = true }
# The Start-menu shortcut's COM interfaces (M7-D4).
windows = { workspace = true }

[dev-dependencies]
lunepack-testkit.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# A job object without breakaway, for the detached-spawn fallback test.
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_Console", "Win32_System_JobObjects"] }

# Own main: the test binary is also the helper program the process suite and the tests start (its
# first argument names the helper mode), and the cases run one after another.
[[test]]
name = "process"
harness = false
