[package]
name = "lunepack-codec-lzma"
description = "LZMA2 codec adapter for lunepack: decodes and encodes the codec ids of the lunepack format in pure Rust."
readme = "README.md"
# The tests (their fixtures, goldens and the fuzz replay) are a checkout's, not a package's.
exclude = ["/tests"]
keywords = ["lzma", "lzma2", "compression", "updater", "delta"]
categories = ["compression"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lunepack-core.workspace = true
lzma-rust2 = "=0.25.0"

[dev-dependencies]
lunepack-testkit.workspace = true
# Counting global allocator of the decoder-memory test (tests/memory.rs): MIT, no dependencies,
# builds on the workspace MSRV (it declares none, uses only long-stable APIs).
peak_alloc = "0.3.0"
# Known-answer tests pin real SHA-256 digests of encoder output.
sha2 = { workspace = true }
