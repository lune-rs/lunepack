[package]
name = "lunepack-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lunepack-core.workspace = true
# The facade (Installation, the lifecycle calls) and the Linux adapters; wired in main.rs (step 8).
lunepack.workspace = true
lunepack-os-linux.workspace = true
# The filesystem and crypto adapters (wired in main.rs, the composition root).
lunepack-fs.workspace = true
lunepack-crypto.workspace = true
# The frame decoder for the setup mode's single-entry reads (M6 step 7).
lunepack-codec-lzma.workspace = true

# The macOS process and per-user integration adapters, and the native notice (M8).
[target.'cfg(target_os = "macos")'.dependencies]
lunepack-os-macos.workspace = true

# The DLL search hardening, first in `main` (M7-D10); the Windows integration joins in step 10.
[target.'cfg(windows)'.dependencies]
lunepack-os-windows.workspace = true

[dev-dependencies]
lunepack-testkit.workspace = true
tempfile = { workspace = true }

# The `file:` feed URL of a Windows path (cli tests).
[target.'cfg(windows)'.dev-dependencies]
url = { workspace = true }

# Own main: the test binary is also the helper app the applier launches (its first argument
# names the helper mode), and the cases run one after another.
[[test]]
name = "apply"
harness = false

# The apply mode on the macOS bundle layout (M8): the same shape, own main, the test binary is the app.
[[test]]
name = "apply_macos"
harness = false

# The UI host against a fake UI (M6): own main, the test binary is also the fake UI and the app.
[[test]]
name = "ui_host"
harness = false

# A setup file run for real (M6 step 7): own main, the test binary is also the fake UI.
[[test]]
name = "setup"
harness = false

# The end-to-end suite (M5-D13): own main, run by scripts/e2e.sh, a SKIP without its environment.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false

# The stand-in UI of the end-to-end suite (M6 step 11): a small executable that speaks the frame
# protocol with no window, packed beside the runtime by `pack --ui`.
[[example]]
name = "e2e_fake_ui"
path = "tests/e2e/fake-ui/main.rs"
