[package]
name = "lunepack-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
lunepack-core.workspace = true
# The facade (Installation, the lifecycle calls) and the Linux adapters; wired in main.rs (step 8).
lunepack.workspace = true
lunepack-os-linux.workspace = true
# The filesystem and crypto adapters (wired in main.rs, the composition root).
lunepack-fs.workspace = true
lunepack-crypto.workspace = true

[dev-dependencies]
lunepack-testkit.workspace = true
tempfile = { workspace = true }

# Own main: the test binary is also the helper app the applier launches (its first argument
# names the helper mode), and the cases run one after another.
[[test]]
name = "apply"
harness = false

# The UI host against a fake UI (M6): own main, the test binary is also the fake UI and the app.
[[test]]
name = "ui_host"
harness = false

# The end-to-end suite (M5-D13): own main, run by scripts/e2e.sh, a SKIP without its environment.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
