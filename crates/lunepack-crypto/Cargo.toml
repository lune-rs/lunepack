[package]
name = "lunepack-crypto"
description = "Hashing, Ed25519 verification and signing adapters for lunepack: SHA-256, strict Ed25519, key files and external signers."
readme = "README.md"
# The tests (their fixtures, goldens and the fuzz replay) are a checkout's, not a package's.
exclude = ["/tests"]
keywords = ["sha256", "ed25519", "signing", "updater", "verification"]
categories = ["cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lunepack-core.workspace = true
sha2 = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8", "pem", "zeroize"] }
getrandom = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
lunepack-testkit.workspace = true
# Test keys are generated at test time; none is committed.
ed25519-dalek = { workspace = true, features = ["rand_core", "signature"] }
getrandom = { workspace = true, features = ["sys_rng"] }
tempfile = { workspace = true }
base64 = { workspace = true }

# Own main: the command-signer and env-signer tests re-run this binary as a helper process, and the
# helper's stdout must hold the signature and nothing else (the libtest harness prints to stdout).
[[test]]
name = "signer"
harness = false
